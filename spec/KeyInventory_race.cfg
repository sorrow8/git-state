\* Negative control: the same protocol with the one-open-plan rule switched off.
\* TLC is expected to find a violation: two plans built on the same inventory
\* both succeed, and the inventory chain forks.
CONSTANTS
    Copies = {c1, c2, c3}
    InitialCopies = {c1}
    Proposers = {p1, p2}
    MaxPlans = 4
    EnforceSingleOpenPlan = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    LinearChain
    NoUnregisteredCopy
    FinalizedMeansNoCopies
