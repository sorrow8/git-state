\* The protocol as specified: one open plan per key. Every check should pass.
CONSTANTS
    Copies = {c1, c2, c3}
    InitialCopies = {c1}
    Proposers = {p1, p2}
    MaxPlans = 4
    EnforceSingleOpenPlan = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    AtMostOneOpenPlan
    LinearChain
    HeadIsInventory
    NoUnregisteredCopy
    DoubtBlocksOperations
    DoubtfulDestroyStillCounted
    FinalizedMeansNoCopies
    NoDuplicateEvents
    ResultHasPriorAuthorization
    ReconcileFollowsUnknown
    ClosedPlanHasOutcome
    OpenPlanHasNoOutcome
    ClosedUnconfirmedMeansNeverConfirmed
    StartedOnlyBeforeDeadline

PROPERTIES
    InventoryChangesOnlyWhenLogged
    PhysicalChangeOnlyWithRecordedResult
