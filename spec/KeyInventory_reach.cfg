\* Reachability check: both deadline interleavings must be possible.
\* Run with -continue. TLC is expected to report BOTH invariants as violated:
\*   NeverFinishesAfterDeadline: start before the deadline, finish after it;
\*   NeverNotPerformed: deadline before the start, so the operation is not performed.
CONSTANTS
    Copies = {c1, c2, c3}
    InitialCopies = {c1}
    Proposers = {p1, p2}
    MaxPlans = 4
    EnforceSingleOpenPlan = TRUE

SPECIFICATION Spec

INVARIANTS
    NeverFinishesAfterDeadline
    NeverNotPerformed
